# Alternative to npm — use if npm still fails after .npmrc is in place.
# Run: yarn install && nocobase install --skip-install-deps

nodeLinker: node-modules

logFilters:
  - code: YN0002
    level: discard
  - code: YN0060
    level: discard
  - code: YN0061
    level: discard
  - code: YN0062
    level: discard
