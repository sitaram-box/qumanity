services:
  - type: web
    name: quantum-box
    runtime: docker
    plan: starter
    region: singapore
    envVars:
      - key: FLASK_ENV
        value: production
      - key: DATABASE_URL
        value: sqlite:////data/indiaq.db
      - key: SECRET_KEY
        generateValue: true
      - key: QOIN_WALLET_ENCRYPTION_KEY
        generateValue: true
    disk:
      name: quantum-data
      mountPath: /data
      sizeGB: 1
