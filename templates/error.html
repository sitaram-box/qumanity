{% extends "base.html" %}

{% block title %}Error — Qumanity{% endblock %}

{% block body %}
<div class="container py-4">
  <div class="qb-panel p-4">
    <h1 class="h4 mb-2">Something went wrong</h1>
    <p class="text-muted mb-3">{{ error or "An unexpected error occurred." }}</p>
    <a href="{{ url_for('dashboard') }}" class="qb-btn qb-btn-primary">Go to Dashboard</a>
    <a href="{{ url_for('index') }}" class="qb-btn qb-btn-neutral ms-2">Home</a>
  </div>
</div>
{% endblock %}
