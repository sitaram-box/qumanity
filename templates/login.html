{% extends "base.html" %}

{% block title %}Log in — Quantum Box{% endblock %}

{% block body %}
<section class="qb-hero mb-4">
  <h1>Log in</h1>
  <p class="qb-lead">Use your <strong>Private ID</strong> and password.</p>
</section>

{% if error %}
<div class="qb-alert qb-alert-error" role="alert">{{ error }}</div>
{% endif %}

<form method="post" action="{{ url_for('login') }}" class="qb-form">
  <div class="qb-form-group">
    <label for="private_id">Private ID</label>
    <input
      type="text"
      class="form-control qb-form-control font-monospace"
      id="private_id"
      name="private_id"
      required
      placeholder="Private ID (e.g. U-7XK9M2L or H_U_ADMIN)"
      value="{{ request.form.get('private_id', '') }}"
      autocomplete="username"
    />
  </div>
  <div class="qb-form-group">
    <label for="password">Password</label>
    <input
      type="password"
      class="form-control qb-form-control"
      id="password"
      name="password"
      required
      autocomplete="current-password"
    />
  </div>
  <button type="submit" class="qb-btn qb-btn-primary">Sign in</button>
  <p class="mt-3 text-muted small">
    New here? <a href="{{ url_for('register') }}">Create an account</a>
  </p>
</form>
{% endblock %}
