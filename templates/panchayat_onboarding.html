{% extends "base.html" %}
{% block title %}Panchayat Onboarding — Qumanity{% endblock %}
{% block body %}
<div class="container py-4" style="max-width: 720px">
  <h1 class="h2 mb-4">Partner Panchayat Onboarding</h1>
  <form id="qb-panchayat-form" class="qb-panel p-4" data-qb-submitting>
    <div class="mb-3">
      <label class="form-label small" for="pv-name">Village name</label>
      <input class="form-control form-control-sm" id="pv-name" name="village_name" required />
    </div>
    <div class="mb-3">
      <label class="form-label small" for="pv-district">District</label>
      <input class="form-control form-control-sm" id="pv-district" name="district" required />
    </div>
    <div class="mb-3">
      <label class="form-label small" for="pv-state">State</label>
      <input class="form-control form-control-sm" id="pv-state" name="state" required />
    </div>
    <div class="mb-3">
      <label class="form-label small" for="pv-pop">Population</label>
      <input type="number" min="500" class="form-control form-control-sm" id="pv-pop" name="population" required />
    </div>
    <div class="mb-3">
      <label class="form-label small" for="pv-sarpanch">Sarpanch / President name</label>
      <input class="form-control form-control-sm" id="pv-sarpanch" name="coordinator" required />
    </div>
    <button type="submit" class="qb-btn qb-btn-primary btn-sm">Submit Expression of Interest</button>
    <p class="small text-muted mt-3 mb-0">Our team will contact you within 5 business days.</p>
  </form>
</div>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='js/panchayat_onboarding.js') }}?v=1"></script>
{% endblock %}
